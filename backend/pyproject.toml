[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-job-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the secure AI-assisted job aggregation platform."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "celery>=5.4.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]
scrapers = [
    "fake-useragent>=1.5.1",
    "pandas>=2.2.0",
    "pyppeteer>=2.0.0",
    "selenium>=4.23.0",
    "webdriver-manager>=4.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q -p no:cacheprovider"
