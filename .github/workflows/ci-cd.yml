name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-test-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: python -m pytest

  migrations:
    name: Database Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: migration_check
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: migration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_user -d migration_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Inspect Alembic heads
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://migration_user:migration_password@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-migration-check-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: alembic heads

      - name: Apply migrations
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://migration_user:migration_password@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-migration-check-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: alembic upgrade head

      - name: Verify current migration
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://migration_user:migration_password@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-migration-check-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: alembic current

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanners
        run: python -m pip install --upgrade pip && python -m pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r backend/app -x backend/app/tests

      - name: Run Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose --no-git

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config
        env:
          POSTGRES_DB: jobapp
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: compose_config_placeholder
          DATABASE_URL: postgresql+psycopg://jobapp:compose_config_placeholder@postgres:5432/jobapp
          REDIS_URL: redis://redis:6379/0
          SESSION_SECRET: compose_config_session_secret_at_least_32_chars
          PASSWORD_RESET_SECRET: compose_config_reset_secret_at_least_32_chars
          UPLOAD_DIR: /var/lib/jobapp/uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg

      - name: Build application images
        run: docker compose build backend frontend worker beat
        env:
          POSTGRES_DB: jobapp
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: compose_build_placeholder
          DATABASE_URL: postgresql+psycopg://jobapp:compose_build_placeholder@postgres:5432/jobapp
          REDIS_URL: redis://redis:6379/0
          SESSION_SECRET: compose_build_session_secret_at_least_32_chars
          PASSWORD_RESET_SECRET: compose_build_reset_secret_at_least_32_chars
          UPLOAD_DIR: /var/lib/jobapp/uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg

  deploy:
    name: Deploy To EC2
    runs-on: ubuntu-latest
    needs:
      - backend
      - migrations
      - frontend
      - security
      - docker
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          test -n "$DEPLOY_PATH"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ec2_deploy_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_PATH/.env on EC2. Create it before deploying." >&2
            exit 1
          fi

          git fetch --prune origin
          git checkout --force "$DEPLOY_SHA"

          docker compose up -d --build --force-recreate --remove-orphans
          docker compose exec -T backend alembic upgrade head
          docker compose ps
          EOF
