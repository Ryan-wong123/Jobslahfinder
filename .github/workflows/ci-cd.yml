name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-test-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg,www.jobslah.com,www.fastjobs.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70 --cov-fail-under=70

  migrations:
    name: Database Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: migration_check
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: migration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_user -d migration_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements.lock

      - name: Inspect Alembic heads
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://migration_user:migration_password@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-migration-check-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg,www.jobslah.com,www.fastjobs.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: alembic heads

      - name: Apply migrations
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://migration_user:migration_password@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-migration-check-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg,www.jobslah.com,www.fastjobs.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: alembic upgrade head

      - name: Verify current migration
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://migration_user:migration_password@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/15
          SESSION_SECRET: test_session_secret_value_at_least_32_chars
          PASSWORD_RESET_SECRET: test_reset_secret_value_at_least_32_chars
          UPLOAD_DIR: /tmp/jobapp-migration-check-uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg,www.jobslah.com,www.fastjobs.sg
          RESUME_EXTRACTION_PROVIDER: local
          COVER_LETTER_GENERATION_PROVIDER: local
        run: alembic current

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for Selenium
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Selenium
        run: python -m pip install --require-hashes -r ../backend/requirements-scraper.lock

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend auth page tests
        run: npm run test:auth-pages

      - name: Run frontend flow tests
        run: npm run test:frontend-flows

      - name: Build frontend
        run: npm run build

      - name: Start frontend server
        run: |
          npm start > next.log 2>&1 &
          echo $! > next.pid

      - name: Run Selenium smoke tests
        env:
          SELENIUM_BASE_URL: http://127.0.0.1:3000
          SELENIUM_REQUIRE_BROWSER: "1"
          SELENIUM_REQUIRE_SERVER: "1"
        run: |
          for i in {1..30}; do
            if curl -fsS "$SELENIUM_BASE_URL" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS "$SELENIUM_BASE_URL" >/dev/null
          npm run test:selenium

      - name: Stop frontend server
        if: always()
        run: |
          if [ -f next.pid ]; then
            kill "$(cat next.pid)" || true
          fi

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install security scanners
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r infra/ci/requirements-scanners.lock

      - name: Run Bandit
        run: bandit -r backend/app backend/risk_engine -x backend/app/tests,backend/risk_engine/test --severity-level high

      - name: Run Python dependency audit
        run: |
          pip-audit -r backend/requirements.lock --no-deps --disable-pip --strict
          pip-audit -r backend/requirements-scraper.lock --no-deps --disable-pip --strict

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose

      - name: Run Trivy vulnerability, secret, and config scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Build And Scan Release Images
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.publish.outputs.backend_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
      scraper_image: ${{ steps.publish.outputs.scraper_image }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config
        env:
          POSTGRES_DB: jobapp
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: compose_config_placeholder
          DATABASE_URL: postgresql+psycopg://jobapp:compose_config_placeholder@postgres:5432/jobapp
          REDIS_URL: redis://redis:6379/0
          SESSION_SECRET: compose_config_session_secret_at_least_32_chars
          PASSWORD_RESET_SECRET: compose_config_reset_secret_at_least_32_chars
          UPLOAD_DIR: /var/lib/jobapp/uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg,www.jobslah.com,www.fastjobs.sg

      - name: Validate production compose profile
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
        env:
          POSTGRES_DB: jobapp
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: compose_config_placeholder
          DOMAIN: ci.example.test

      - name: Validate production Nginx config
        run: |
          DOMAIN=ci.example.test
          mkdir -p ci-nginx/certs/live/$DOMAIN ci-nginx/conf
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$DOMAIN" \
            -keyout ci-nginx/certs/live/$DOMAIN/privkey.pem -out ci-nginx/certs/live/$DOMAIN/fullchain.pem
          docker run --rm -e DOMAIN=$DOMAIN \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/ci-nginx/certs:/etc/letsencrypt:ro" \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            --entrypoint sh nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311 -c \
            'envsubst "\$DOMAIN" < /etc/nginx/templates/production.conf.template > /etc/nginx/conf.d/default.conf && nginx -t'

      - name: Syntax-check deployment scripts
        run: for f in infra/scripts/*.sh; do bash -n "$f"; done

      - name: Build application images
        run: docker compose build backend frontend worker beat scraper
        env:
          POSTGRES_DB: jobapp
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: compose_build_placeholder
          DATABASE_URL: postgresql+psycopg://jobapp:compose_build_placeholder@postgres:5432/jobapp
          REDIS_URL: redis://redis:6379/0
          SESSION_SECRET: compose_build_session_secret_at_least_32_chars
          PASSWORD_RESET_SECRET: compose_build_reset_secret_at_least_32_chars
          UPLOAD_DIR: /var/lib/jobapp/uploads
          ALLOWED_JOB_SOURCE_DOMAINS: sg.jobstreet.com,www.mycareersfuture.gov.sg,www.jobslah.com,www.fastjobs.sg


      - name: Set up Python for infrastructure verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked infrastructure test dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Verify database privileges, reset races, and encrypted restore
        run: python infra/scripts/test-database-security.py

      - name: Verify Redis ACLs and Celery compatibility
        run: python infra/scripts/test-redis-security.py

      - name: Verify parser filesystem and credential isolation
        run: python infra/scripts/test-parser-sandbox.py

      - name: Verify native Chromium sandbox
        run: python infra/scripts/test-scraper-sandbox.py

      - name: Verify effective Nginx security headers
        run: python infra/scripts/test-nginx-headers.py

      - name: Verify release and rollback decisions
        run: python infra/scripts/test-deployment.py

      - name: Scan built backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          timeout: 15m
          image-ref: jobslahfinder-backend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan built scraper image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          timeout: 15m
          image-ref: jobslahfinder-scraper:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan built frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          timeout: 15m
          image-ref: jobslahfinder-frontend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Authenticate release registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned images by digest
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for role in backend scraper frontend; do
            tag="$prefix/$role:$GITHUB_SHA"
            docker tag "jobslahfinder-$role:local" "$tag"
            docker push "$tag"
            digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
            echo "${role}_image=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Deploy To EC2
    runs-on: ubuntu-latest
    needs:
      - backend
      - migrations
      - frontend
      - security
      - docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate required deployment secrets
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$EC2_INSTANCE_ID"
          test -n "$DEPLOY_PATH"

      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          role-session-name: github-deploy

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: bash infra/scripts/ssm-deploy.sh
