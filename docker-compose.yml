services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      SCRAPER_DB_PASSWORD: ${SCRAPER_DB_PASSWORD:?SCRAPER_DB_PASSWORD is required}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    user: redis
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?AUTH_REDIS_PASSWORD is required}
    command: ["sh", "/etc/redis/start.sh"]
    volumes:
      - redis_data:/data
      - ./infra/redis/start.sh:/etc/redis/start.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$AUTH_REDIS_PASSWORD redis-cli --user auth ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-jobslahfinder-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RISK_ENGINE_DATA_DIR: /var/lib/jobapp/risk-engine
      RISK_ENGINE_BASE_PATH: /risk-engine
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - resume_storage:/var/lib/jobapp/uploads
      - risk_engine_data:/var/lib/jobapp/risk-engine
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ${BACKEND_IMAGE:-jobslahfinder-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "private", "--loglevel=INFO", "--concurrency=2", "-Ofair"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - resume_storage:/var/lib/jobapp/uploads
    networks:
      - internal

  scraper:
    image: ${SCRAPER_IMAGE:-jobslahfinder-scraper:local}
    build:
      context: ./backend
      target: scraper
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_ROLE: scraper
      DATABASE_URL: ${SCRAPER_DATABASE_URL:?SCRAPER_DATABASE_URL is required}
      RESUME_EXTRACTION_PROVIDER: local
      COVER_LETTER_GENERATION_PROVIDER: local
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "scraping", "--loglevel=INFO", "--concurrency=1", "-Ofair"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  beat:
    image: ${BACKEND_IMAGE:-jobslahfinder-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule"
      ]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-jobslahfinder-frontend:local}
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_SERVER_API_BASE_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net'); const socket=net.connect(3000,'127.0.0.1',()=>process.exit(0)); socket.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),5000);"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  resume_storage:
  risk_engine_data:
